<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="PilotV">
<style>

@keyframes flip{
  0%   { transform: scaleX(1); animation-timing-function: cubic-bezier(.45,.05,.35,1); }
  50%  { transform: scaleX(-1); animation-timing-function: cubic-bezier(.45,.05,.35,1); }
  100% { transform: scaleX(1); }
}
.flip{transform-box:fill-box;transform-origin:50% 50%;animation:flip 4.2s ease-in-out infinite}

@keyframes bar{
  0%,66%,100% { transform: scaleX(.42); opacity: .45; }
  22%,56%     { transform: scaleX(1);   opacity: 1;   }
}
.bar{transform-box:fill-box;transform-origin:50% 50%;animation:bar 8.4s cubic-bezier(.45,.05,.35,1) infinite}
@media (prefers-reduced-motion:reduce){.flip,.bar{animation:none}}
</style>
