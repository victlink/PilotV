<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 279.9 100.9" width="280" height="101" role="img" aria-label="PilotV">
<style>

@keyframes lead{
  0%   { transform: translate(0,0) rotate(0deg) }
  14%  { transform: translate(0,-14.57px) rotate(14.00deg) }
  34%  { transform: translate(3.64px,6.56px) rotate(-5.60deg) }
  52%  { transform: translate(0,0) rotate(0deg) }
  80%  { transform: translate(0,-5.10px) rotate(6.30deg) }
  100% { transform: translate(0,0) rotate(0deg) }
}

@keyframes trail{
  0%   { transform: translate(0,0) rotate(0deg) }
  14%  { transform: translate(0,-8.45px) rotate(8.12deg) }
  34%  { transform: translate(2.11px,3.80px) rotate(-3.25deg) }
  52%  { transform: translate(0,0) rotate(0deg) }
  80%  { transform: translate(0,-2.96px) rotate(3.65deg) }
  100% { transform: translate(0,0) rotate(0deg) }
}
.l{transform-box:fill-box;transform-origin:50% 100%;animation-duration:1.4s;animation-timing-function:cubic-bezier(.45,.05,.35,1);animation-iteration-count:infinite}
.lead{animation-name:lead;animation-delay:0s}
.trail{animation-name:trail}
@media (prefers-reduced-motion:reduce){.l{animation:none}}
